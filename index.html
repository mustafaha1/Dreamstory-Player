<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dreamtime Story Player</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #b6fbff, #83a4d4);
            margin: 0;
            padding: 20px;
        }

        .story-player {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .player-card {
            background-color: #fff9f9;
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(50, 50, 93, 0.1), 0 5px 15px rgba(0, 0, 0, 0.07);
            border: 4px solid #ffd6ff;
        }

        .cover-art {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 15px;
            border: 3px solid #ffa7e6;
            margin: 0 auto 15px auto;
            display: block;
        }

        .story-info {
            margin-bottom: 20px;
        }

        h1 {
            color: #5a3d80;
            margin-bottom: 30px;
            font-size: 2.2em;
            text-shadow: 2px 2px 0px #ffd6ff;
        }

        h2 {
            color: #6a59a7;
            font-size: 1.4em;
            margin-top: 0;
            margin-bottom: 5px;
        }

        h3 {
            color: #8e6fb8;
            border-bottom: 2px dashed #ffd6ff;
            padding-bottom: 8px;
        }

        p {
            color: #7b88a1;
            margin-top: 0;
        }

        .audio-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .audio-controls > div {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: center;
        }

        #play-pause-btn, #next-btn, #prev-btn, #mute-btn {
            font-size: 1.5em;
            border: none;
            background: none;
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        #play-pause-btn {
            font-size: 1.8em;
        }

        #play-pause-btn:hover, #next-btn:hover, #prev-btn:hover, #mute-btn:hover {
            transform: scale(1.1);
            background-color: #f0e6ff;
        }

        #progress-bar {
            width: 100%;
            height: 10px;
            -webkit-appearance: none;
            appearance: none;
            background: #e0e0e0;
            border-radius: 5px;
            outline: none;
            overflow: hidden;
        }

        #progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #9b7cfe;
            cursor: pointer;
            box-shadow: -407px 0 0 400px #c0b3ff;
        }

        #progress-bar::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #9b7cfe;
            cursor: pointer;
            border: none;
        }

        #current-time {
            font-size: 0.9em;
            color: #6a59a7;
            font-weight: bold;
            min-width: 40px;
            text-align: left;
        }

        .time-volume {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: center;
        }

        /* Playlist Styles */
        .playlist {
            border-top: 2px dashed #ffd6ff;
            padding-top: 20px;
        }

        .story-btn {
            display: block;
            width: 100%;
            padding: 12px 15px;
            margin: 8px 0;
            background-color: #f0e6ff;
            border: none;
            border-radius: 10px;
            text-align: left;
            cursor: pointer;
            font-family: 'Comic Sans MS', cursive;
            font-size: 1em;
            color: #5a3d80;
            transition: all 0.2s;
        }

        .story-btn:hover {
            background-color: #d9c8ff;
            transform: translateX(5px);
        }

        .story-btn.playing {
            background-color: #c0b3ff;
            color: white;
            font-weight: bold;
        }

        /* Upload Section */
        .upload-section {
            background-color: #e0f7fa;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
            border: 2px dashed #4db6ac;
        }

        .upload-section h3 {
            color: #00796b;
            margin-top: 0;
        }

        .upload-section p {
            color: #00796b;
            margin-bottom: 10px;
        }

        #file-upload {
            margin: 10px 0;
            padding: 5px;
        }

        #upload-status {
            font-size: 0.9em;
            color: #00796b;
            min-height: 20px;
        }

        /* Style for the text content display */
        #story-text-content {
            display: none;
            max-height: 150px;
            overflow-y: auto;
            margin-top: 15px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
            border-left: 4px solid #9b7cfe;
            font-size: 0.95em;
            line-height: 1.5;
            text-align: left;
        }

        .tts-warning {
            color: #ff6b6b;
            font-size: 0.8em;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="story-player">
        <h1>🌙 Dreamtime Stories</h1>
        
        <!-- File Upload Section -->
        <div class="upload-section">
            <h3>Add Your Own Story</h3>
            <p>Upload an audio file (MP3) or a text file (TXT)</p>
            <input type="file" id="file-upload" accept=".mp3,.txt" />
            <div id="upload-status"></div>
            <div class="tts-warning" id="tts-warning">
                Note: Text-to-speech may require user interaction first in some browsers.
            </div>
        </div>
        
        <div class="player-card">
            <img id="cover-art" src="https://placehold.co/300x300/b6fbff/6a59a7?text=Upload+a+Story" alt="Story Cover Art" class="cover-art">
            
            <div class="story-info">
                <h2 id="story-title">Your Story Awaits</h2>
                <p id="story-desc">Upload a file to begin.</p>
                <!-- This will show the text content for TTS -->
                <div id="story-text-content"></div>
            </div>
            
            <div class="audio-controls">
                <button id="prev-btn">⏮️</button>
                <button id="play-pause-btn">▶️</button>
                <button id="next-btn">⏭️</button>
                <input type="range" id="progress-bar" value="0">
                <div class="time-volume">
                    <span id="current-time">0:00</span>
                    <button id="mute-btn">🔊</button>
                </div>
            </div>

            <!-- The Playlist of Stories -->
            <div class="playlist">
                <h3>Your Story Library</h3>
                <div id="story-buttons">
                    <!-- Story buttons will be generated here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 1. OUR STORY LIBRARY
            const storyLibrary = [];

            // 2. GET ALL OUR HTML ELEMENTS
            const audio = new Audio();
            const playPauseBtn = document.getElementById('play-pause-btn');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const progressBar = document.getElementById('progress-bar');
            const currentTimeEl = document.getElementById('current-time');
            const muteBtn = document.getElementById('mute-btn');
            const storyTitleEl = document.getElementById('story-title');
            const storyDescEl = document.getElementById('story-desc');
            const coverArtEl = document.getElementById('cover-art');
            const storyButtonsContainer = document.getElementById('story-buttons');
            const fileUpload = document.getElementById('file-upload');
            const uploadStatus = document.getElementById('upload-status');
            const storyTextContentEl = document.getElementById('story-text-content');
            const ttsWarning = document.getElementById('tts-warning');

            // 3. TEXT-TO-SPEECH SETUP
            const speechSynth = window.speechSynthesis;
            let currentSpeechUtterance = null;
            let isPlaying = false;
            let currentStoryIndex = -1;
            let isTTSMode = false;

            // 4. FUNCTION TO STOP ANY ONGOING TTS
            function stopTTS() {
                if (speechSynth.speaking) {
                    speechSynth.cancel();
                }
                currentSpeechUtterance = null;
                isTTSMode = false;
                storyTextContentEl.style.display = 'none';
            }

            // 5. FUNCTION TO LOAD A STORY
            function loadStory(index) {
                if (index < 0 || index >= storyLibrary.length) return;
                
                stopTTS();
                currentStoryIndex = index;

                const story = storyLibrary[index];
                storyTitleEl.textContent = story.title;
                storyDescEl.textContent = story.description;
                
                if (story.coverArt) {
                    coverArtEl.src = story.coverArt;
                }

                // Reset UI elements
                storyTextContentEl.style.display = 'none';
                progressBar.value = 0;
                currentTimeEl.textContent = '0:00';

                // Handle different story types
                if (story.audioUrl) {
                    // Pre-loaded audio story
                    audio.src = story.audioUrl;
                    audio.load();
                    isTTSMode = false;
                    playPauseBtn.disabled = false;
                } else if (story.fileType === 'audio') {
                    // Uploaded audio story
                    audio.src = URL.createObjectURL(story.uploadedFile);
                    audio.load();
                    isTTSMode = false;
                    playPauseBtn.disabled = false;
                } else if (story.fileType === 'text') {
                    // Text story for TTS
                    isTTSMode = true;
                    audio.src = '';
                    storyTextContentEl.textContent = story.fileContent;
                    storyTextContentEl.style.display = 'block';
                    playPauseBtn.disabled = false;
                    
                    // Check if TTS is available
                    if (!speechSynth) {
                        uploadStatus.textContent = "Text-to-speech is not supported in your browser.";
                        playPauseBtn.disabled = true;
                    }
                }

                // Update playlist highlights
                const allButtons = document.querySelectorAll('.story-btn');
                allButtons.forEach(btn => btn.classList.remove('playing'));
                if (allButtons[index]) {
                    allButtons[index].classList.add('playing');
                }

                // Reset play button state
                isPlaying = false;
                playPauseBtn.textContent = '▶️';
            }

            // 6. PLAY/PAUSE LOGIC (handles both Audio and TTS)
            function togglePlayPause() {
                if (currentStoryIndex === -1) return;
                
                if (isPlaying) {
                    // PAUSE
                    if (isTTSMode) {
                        if (speechSynth.speaking) {
                            speechSynth.pause();
                        }
                    } else {
                        audio.pause();
                    }
                    playPauseBtn.textContent = '▶️';
                    isPlaying = false;
                } else {
                    // PLAY - Need user interaction for TTS to work
                    if (isTTSMode) {
                        const story = storyLibrary[currentStoryIndex];
                        if (!speechSynth.speaking && !speechSynth.paused) {
                            currentSpeechUtterance = new SpeechSynthesisUtterance(story.fileContent);
                            currentSpeechUtterance.rate = 0.9;
                            currentSpeechUtterance.pitch = 1.1;
                            
                            currentSpeechUtterance.onend = function() {
                                isPlaying = false;
                                playPauseBtn.textContent = '▶️';
                            };
                            
                            speechSynth.speak(currentSpeechUtterance);
                        } else if (speechSynth.paused) {
                            speechSynth.resume();
                        }
                    } else {
                        audio.play();
                    }
                    playPauseBtn.textContent = '⏸️';
                    isPlaying = true;
                }
            }

            // 7. FILE UPLOAD HANDLING
            fileUpload.addEventListener('change', function(event) {
                const file = event.target.files[0];
                if (!file) return;

                uploadStatus.textContent = 'Uploading...';
                const fileName = file.name;
                const fileType = fileName.endsWith('.mp3') ? 'audio' : 'text';

                if (fileType === 'audio' && !file.type.startsWith('audio/')) {
                    uploadStatus.textContent = 'Please upload a valid MP3 audio file.';
                    return;
                }

                // Create a new story entry
                const newStory = {
                    title: fileName,
                    description: `Your uploaded ${fileType} story`,
                    coverArt: 'https://placehold.co/300x300/e0f7fa/00796b?text=Your+Story',
                    fileType: fileType,
                    uploadedFile: file
                };

                // Handle text files
                if (fileType === 'text') {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        newStory.fileContent = e.target.result;
                        addStoryToLibrary(newStory);
                    };
                    reader.onerror = function() {
                        uploadStatus.textContent = 'Error reading text file.';
                    };
                    reader.readAsText(file);
                } else {
                    addStoryToLibrary(newStory);
                }

                function addStoryToLibrary(story) {
                    storyLibrary.push(story);
                    createStoryButton(story, storyLibrary.length - 1);
                    uploadStatus.textContent = `"${fileName}" added successfully!`;
                    
                    // Auto-load the first story if it's the first one
                    if (storyLibrary.length === 1) {
                        loadStory(0);
                    }
                }
            });

            // 8. CREATE BUTTONS FOR STORIES
            function createStoryButton(story, index) {
                const button = document.createElement('button');
                button.textContent = `${index + 1}. ${story.title}`;
                button.classList.add('story-btn');
                button.addEventListener('click', () => {
                    // This click event provides the user interaction needed for TTS
                    loadStory(index);
                });
                storyButtonsContainer.appendChild(button);
            }

            // 9. REMAINING CONTROLS
            prevBtn.addEventListener('click', () => {
                if (storyLibrary.length === 0) return;
                let newIndex = currentStoryIndex - 1;
                if (newIndex < 0) newIndex = storyLibrary.length - 1;
                loadStory(newIndex);
            });

            nextBtn.addEventListener('click', () => {
                if (storyLibrary.length === 0) return;
                let newIndex = currentStoryIndex + 1;
                if (newIndex >= storyLibrary.length) newIndex = 0;
                loadStory(newIndex);
            });

            audio.addEventListener('timeupdate', () => {
                if (audio.duration && !isTTSMode) {
                    const progressPercent = (audio.currentTime / audio.duration) * 100;
                    progressBar.value = progressPercent;
                    const mins = Math.floor(audio.currentTime / 60);
                    const secs = Math.floor(audio.currentTime % 60).toString().padStart(2, '0');
                    currentTimeEl.textContent = `${mins}:${secs}`;
                }
            });

            progressBar.addEventListener('input', () => {
                if (!isTTSMode && audio.duration) {
                    const seekTime = (progressBar.value / 100) * audio.duration;
                    audio.currentTime = seekTime;
                }
            });

            muteBtn.addEventListener('click', () => {
                if (isTTSMode) {
                    uploadStatus.textContent = "Use system volume controls for text stories.";
                } else {
                    audio.muted = !audio.muted;
                    muteBtn.textContent = audio.muted ? '🔇' : '🔊';
                }
            });

            audio.addEventListener('ended', () => {
                if (!isTTSMode && storyLibrary.length > 0) {
                    let newIndex = currentStoryIndex + 1;
                    if (newIndex >= storyLibrary.length) newIndex = 0;
                    loadStory(newIndex);
                }
            });

            // 10. INITIALIZE
            playPauseBtn.addEventListener('click', togglePlayPause);
            
            // Add a test story for demonstration
            const testStory = {
                title: "Try Me: Test Story",
                description: "A sample story to test text-to-speech",
                coverArt: "https://placehold.co/300x300/ffd6ff/6a59a7?text=Test+Story",
                fileType: "text",
                fileContent: "Hello! This is a test story. If you can hear this, text-to-speech is working perfectly! The quick brown fox jumps over the lazy dog. Once upon a time, in a land far away, there lived a brave knight and a clever dragon who became the best of friends."
            };
            storyLibrary.push(testStory);
            createStoryButton(testStory, 0);
        });
    </script>
</body>
</html>
